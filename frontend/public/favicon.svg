<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Metallic gradient for the MK text -->
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f0f0" />
      <stop offset="50%" stop-color="#b0b0b0" />
      <stop offset="100%" stop-color="#808080" />
    </linearGradient>
  </defs>
  
  <!-- Dark background -->
  <rect width="100" height="100" fill="#121215" rx="20" />
  
  <!-- The M -->
  <path d="M 15 70 L 15 35 L 35 55 L 55 35 L 55 70 L 45 70 L 45 45 L 35 55 L 25 45 L 25 70 Z" fill="url(#metal)" />
  
  <!-- The K (shares the vertical stem with the M) -->
  <path d="M 55 50 L 75 35 L 85 35 L 62 52 L 85 70 L 73 70 L 55 55 Z" fill="url(#metal)" />
  
  <!-- The Pink Dot -->
  <rect x="75" y="58" width="12" height="12" fill="#ff3b7e" />
</svg>